# AirPodsClean: the AirPods hi-res uplink with RNNoise over it. The raw uplink measured
# about 12 dB between a voice and the room; with this it measured about 24 dB.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "AirPods (noise suppressed)"
      media.name       = "AirPods (noise suppressed)"
      filter.graph = {
        nodes = [
          { type  = ladspa
            name  = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50.0 "VAD Grace Period (ms)" = 200 "Retroactive VAD Grace (ms)" = 0 }
          }
        ]
      }
      capture.props = {
        node.name   = "airpods_clean_capture"
        node.passive = true
        # Follows the daemon's source by name, so a reconnect that renumbers it still lands here.
        target.object = "AirPodsHiRes"
        stream.capture.sink = false
      }
      playback.props = {
        node.name   = "AirPodsClean"
        media.class = Audio/Source
      }
    }
  }
]
